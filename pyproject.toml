[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "priwo"
version = "0.1.0"
readme = "README.md"
dependencies = ["numpy"]
requires-python = ">=3.8"
license = { file = "LICENSE" }
description = "I/O for common pulsar/FRB data formats."
authors = [{ name = "Ujjwal Panda", email = "ujjwapanda97@gmail.com" }]

classifiers = [
  "Operating System :: Unix",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Source = "https://github.com/astrogewgaw/priwo"
Homepage = "https://github.com/astrogewgaw/priwo"
Issues = "https://github.com/astrogewgaw/priwo/issues"
Documentation = "https://priwo.readthedocs.io/en/latest"

[tool.scikit-build]
wheel.py-api = "cp312"          # Build stable ABI wheels for CPython 3.12+
minimum-version = "0.4"         # Protect the configuration against future changes in scikit-build-core
build-dir = "build/{wheel_tag}" # Setuptools-style build caching in a local directory
